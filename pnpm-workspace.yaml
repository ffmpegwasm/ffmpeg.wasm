# Only resolve versions published at least a week ago.
minimumReleaseAge: 10080

packages:
  - packages/*
  - apps/*
# Dependencies allowed to run install scripts: the native ones. The others
# only print messages.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  core-js: false
  lmdb: false
  msgpackr-extract: false
  core-js-pure: false
  nice-napi: false
  svelte-preprocess: false
# react-ace's typings import React without declaring @types/react, so they
# otherwise pick up whichever version is hoisted.
packageExtensions:
  react-ace:
    peerDependencies:
      "@types/react": "*"
