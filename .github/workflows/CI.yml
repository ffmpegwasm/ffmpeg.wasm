name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v2
      - name: Update pkg-config database
        run: sudo ldconfig
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: Cache build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build-cache-st
          key: build-cache-st-v1-${{ hashFiles('Dockerfile', 'Makefile', 'build/*') }}
          restore-keys: |
            build-cache-st-v1-
      - name: Build ffmpeg-core
        run: make prd EXTRA_ARGS="--cache-from=type=local,src=build-cache-st --cache-to=type=local,dest=build-cache-st,mode=max"
      - name: Build ffmpeg-core's JSPI build
        run: make prd-jspi EXTRA_ARGS="--cache-from=type=local,src=build-cache-st"
      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core
          path: packages/core/dist/*
  build-core-mt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v2
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: Cache build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build-cache-mt
          key: build-cache-mt-v1-${{ hashFiles('Dockerfile', 'Makefile', 'build/*') }}
          restore-keys: |
            build-cache-v1-
      - name: Build ffmpet-core-mt
        run: make prd-mt EXTRA_ARGS="--cache-from=type=local,src=build-cache-mt --cache-to=type=local,dest=build-cache-mt,mode=max"
      - name: Upload core-mt
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist/*
  tests:
    # Node 22 (the oldest LTS release), 24 and 26.
    runs-on: ubuntu-latest
    needs: [build-core, build-core-mt]
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit --project 'core-*' --project node # core-jspi on Node.js 24+
  browser:
    # @ffmpeg/ffmpeg and @ffmpeg/util in Chromium.
    runs-on: ubuntu-latest
    needs: [build-core, build-core-mt]
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:install
      - run: pnpm test:unit --project 'browser-*'
      - run: pnpm test:e2e
  heavy:
    # FATE samples + benchmarks: nightly, on demand, or with the "heavy" PR label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'heavy')
    runs-on: ubuntu-latest
    needs: [build-core, build-core-mt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache/fate-suite
          key: fate-suite-v1
      - run: pnpm install --frozen-lockfile
      - name: FATE samples
        run: pnpm test:heavy --reporter=default --reporter=json --outputFile.json=tests/heavy/results/fate.json
      - name: FATE baseline from this run, to commit if the changes are expected
        if: failure()
        run: pnpm test:heavy -u
      - name: Benchmarks
        if: always()
        run: pnpm bench --reporter=default --reporter=json --outputFile.json=tests/heavy/results/bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-results
          path: |
            tests/heavy/results
            tests/heavy/baseline
